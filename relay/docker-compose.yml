# A complete relay for the Walkie-Talkie messenger. Works on a Raspberry Pi (any model: all
# three images are published for arm/v6, arm/v7 and arm64) as well as on ordinary servers.
#
#   cp .env.example .env     # fill in RELAY_HOST, TURN_SECRET, ACCESS_CODE
#   docker compose up -d                    # behind your own HTTPS proxy (Traefik, nginx, ...)
#   docker compose --profile https up -d    # or let the bundled Caddy get a certificate itself
#
# Then, in the app: Settings -> My relay -> wss://<RELAY_HOST>
services:
  # Signalling + mailbox relay, and TURN credentials. Listens on plain HTTP/WebSocket;
  # the app needs wss://, so an HTTPS proxy must sit in front (yours, or `caddy` below).
  relay:
    build: .
    image: walkie-talkie-relay
    restart: unless-stopped
    environment:
      RELAY_HOST: ${RELAY_HOST:?set RELAY_HOST in .env}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      ACCESS_CODE: ${ACCESS_CODE:-}
      TURN_PORT: ${TURN_PORT:-3478}
      MAIL_TTL_DAYS: ${MAIL_TTL_DAYS:-8}
      MAX_STORED_MB: ${MAX_STORED_MB:-100}
      # A Pi has little memory to spare: keep Node's heap modest. (Not a Docker memory limit:
      # Raspberry Pi OS ships with the memory cgroup off, where those are ignored.)
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - relay-data:/data
    ports:
      - "${RELAY_PORT:-7777}:7777"

  # Carries a WebRTC connection between two devices that can't reach each other directly.
  # Host networking, because it relays through a range of UDP ports.
  turn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --realm=${RELAY_HOST:?set RELAY_HOST in .env}
      # Time-limited credentials handed out by the relay above (never a fixed password).
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      # Behind a home router the server must tell clients its public address.
      - --external-ip=${EXTERNAL_IP:-$$(detect-external-ip)}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Modest limits so one visitor can't use all of a home connection.
      - --total-quota=100
      - --user-quota=12
      - --max-bps=1500000
      - --stale-nonce=600

  # Optional: HTTPS with an automatic certificate. Needs ports 80 and 443 reachable from the
  # internet. Skip it (omit --profile https) if you already run a reverse proxy.
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${RELAY_HOST:?set RELAY_HOST in .env} --to relay:7777
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on: [relay]

volumes:
  relay-data:
  caddy-data:
